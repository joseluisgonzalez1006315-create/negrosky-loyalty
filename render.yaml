services:
  - type: web
    name: negrosky-loyalty
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEGROSKY_ADMIN_EMAIL
        sync: false
      - key: NEGROSKY_ADMIN_PASSWORD
        sync: false
