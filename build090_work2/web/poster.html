<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartel del negocio</title><style>
:root{--primary:#a970ff;--secondary:#7547d8;--bg:#090812;--text:#fff}*{box-sizing:border-box}body{margin:0;background:#151024;color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.poster{width:min(92vw,560px);min-height:760px;padding:42px 28px;text-align:center;background:linear-gradient(145deg,var(--primary),var(--secondary) 55%,#130d24);border-radius:28px;box-shadow:0 20px 60px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center}.poster img.logo{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:24px;padding:10px;margin-bottom:24px}.poster h1{font-size:clamp(2rem,7vw,3.4rem);margin:8px 0}.poster p{font-size:1.35rem;margin:10px 0}.qr{width:260px;height:260px;background:#fff;padding:14px;border-radius:18px;margin:28px 0 16px}.hint{font-weight:bold}.actions{position:fixed;top:16px;right:16px;display:flex;gap:8px}.actions button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}@media print{body{background:#fff}.poster{width:100%;min-height:100vh;border-radius:0;box-shadow:none}.actions{display:none}}
</style></head><body><div class="actions"><button onclick="window.print()">Imprimir</button><button onclick="window.close()">Cerrar</button></div><main class="poster"><div id="logo"></div><h1 id="name">Cargando…</h1><p>Únete a nuestro club de beneficios</p><img id="qr" class="qr" alt="Código QR del negocio"><p class="hint">Escanea este código con tu celular</p><p>Disfruta promociones, puntos y beneficios exclusivos</p></main><script>
const slug=location.pathname.split('/').filter(Boolean).pop();fetch('/api/public/'+encodeURIComponent(slug)+'/branding').then(r=>r.json()).then(b=>{document.title='Cartel · '+b.display_name;document.getElementById('name').textContent=b.display_name||slug;if(b.primary_color)document.documentElement.style.setProperty('--primary',b.primary_color);if(b.secondary_color)document.documentElement.style.setProperty('--secondary',b.secondary_color);const box=document.getElementById('logo');box.innerHTML=b.logo_url?'<img class="logo" src="'+b.logo_url+'?v='+Date.now()+'" alt="Logo">':'<div class="logo" style="display:grid;place-items:center;font-size:80px;color:var(--secondary)">N</div>';document.getElementById('qr').src='/api/public/'+encodeURIComponent(slug)+'/qr.png?v='+Date.now()}).catch(()=>document.getElementById('name').textContent='Negocio no encontrado');
</script><script src="/static/brand-footer.js?v=1"></script></body></html>
